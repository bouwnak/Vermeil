<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your companion</title>
<link rel="stylesheet" href="vendor/fonts/nunito.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
<style>
  /* her box over a game (skills/gamebuddy.py): only an outline, with the game showing through, and her words fading out into it */
  :root { --accent-rgb: 92, 160, 255; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: #fff; font: 600 14px Nunito, "Segoe UI", sans-serif; user-select: none; }
  #wrap { height: 100%; display: flex; }
  #wrap.side { flex-direction: column; }
  #box { position: relative; flex: none; width: 100vh; max-width: 100vw; height: 100%; box-sizing: border-box; overflow: hidden; cursor: move;
    border: 1.5px solid rgba(var(--accent-rgb), .6); border-radius: 14px; box-shadow: 0 0 10px rgba(var(--accent-rgb), .25); }
  #wrap.side #box { width: 100%; height: 100vw; max-height: 100vh; }
  .vm-canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; opacity: 0; transition: opacity .6s; }
  .vm-ready .vm-canvas { opacity: 1; }
  .vm-face { position: absolute; inset: 0; display: none; place-items: center; font-size: 64px; }
  .vm-flat .vm-face { display: grid; }
  /* the faded box: only as big as her words. A fine pattern of dark dots with the game showing between them, thinning out
     at the edge. Windows can only cut out one exact colour, so "half see-through" has to be made of dots */
  #words { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: flex-start; padding: 0 0 0 6px; box-sizing: border-box; overflow: hidden; line-height: 1.3;
    opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #words > div { position: relative; width: fit-content; max-width: 100%; box-sizing: border-box; padding: 7px 26px 9px 11px; }
  #words > div::before { content: ""; position: absolute; inset: 0; background: conic-gradient(#10141b 25%, transparent 0 50%, #10141b 0 75%, transparent 0) 0 0 / 2px 2px;
    -webkit-mask: linear-gradient(to right, #000 calc(100% - 20px), transparent); mask: linear-gradient(to right, #000 calc(100% - 20px), transparent); }
  #words b, #words p { position: relative; }
  #wrap.side #words { padding: 6px 0 0; }
  #wrap.talking #words { opacity: 1; }
  #words b { display: block; color: rgb(var(--accent-rgb)); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  #words p { margin: 1px 0 0; font-size: 14px; font-weight: 700; text-shadow: 0 0 3px #000, 0 1px 2px #000, 0 0 1px #000; }
  .tools { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; z-index: 2; }
  #box:hover .tools { opacity: 1; }
  .tools button { width: 24px; height: 24px; padding: 0; font: inherit; font-size: 12px; color: #fff; background: rgba(6, 8, 12, .7); border: 0; border-radius: 7px; cursor: pointer; }
  .tools button:focus-visible { opacity: 1; outline: 2px solid rgb(var(--accent-rgb)); }
  .tools button.off { opacity: .45; text-decoration: line-through; }
</style>
</head>
<body>
<div id="wrap">
  <div id="box">
    <span class="vm-face" aria-hidden="true">💜</span>
    <div class="tools">
      <button id="see" type="button" title="She can see your game" aria-label="She can see your game" aria-pressed="true">👁</button>
      <button id="close" type="button" title="Close her box for this game" aria-label="Close her box for this game">✕</button>
    </div>
  </div>
  <div id="words" aria-live="polite"><div><b id="name">Vermeil</b><p id="line"></p></div></div>
</div>
<script type="module">
import { closeUp } from "./closeup.js";
const $ = (id) => document.getElementById(id);
const ready = new Promise((go) => { if (window.pywebview?.api?.info) go(); else addEventListener("pywebviewready", go, { once: true }); });
const api = async (name, ...args) => { await ready; return window.pywebview.api[name](...args); };
let her = { react() {}, talk() {}, pause() {} };
let talkTimer = 0;
const paintSee = (on) => { $("see").classList.toggle("off", !on); $("see").setAttribute("aria-pressed", String(on)); };
window.buddy = {
  say(text, mood, ms) {
    $("line").textContent = text;
    her.talk(Math.min(ms, 3500 + text.length * 40));
    her.react("", mood || "happy");
    clearTimeout(talkTimer);
    talkTimer = setTimeout(() => $("wrap").classList.remove("talking"), ms);
    $("wrap").classList.add("talking");
  },
  layout(mode, talking) {
    $("wrap").classList.toggle("side", mode === "side");
    $("wrap").classList.toggle("talking", !!talking);
  },
  pause(on) { her.pause(on); },
};
$("see").onclick = async (e) => { e.stopPropagation(); const r = await api("set_see", $("see").getAttribute("aria-pressed") !== "true"); paintSee(r.see); };
$("close").onclick = (e) => { e.stopPropagation(); api("close_box"); };
for (const b of document.querySelectorAll(".tools button")) b.addEventListener("mousedown", (e) => e.stopPropagation());
// drag her anywhere: she stays there. (pywebview's own drag fails on a window that's placed by hand.)
let drag = null, sending = false;
$("box").addEventListener("pointerdown", (e) => {
  if (e.target.closest(".tools")) return;
  drag = { x: e.screenX, y: e.screenY, dx: 0, dy: 0 };
  try { $("box").setPointerCapture(e.pointerId); } catch { /* a scripted press */ }
});
$("box").addEventListener("pointermove", async (e) => {
  if (!drag) return;
  drag.dx += e.screenX - drag.x; drag.dy += e.screenY - drag.y;
  drag.x = e.screenX; drag.y = e.screenY;
  if (sending) return;
  sending = true;
  const k = window.devicePixelRatio || 1, dx = drag.dx * k, dy = drag.dy * k;
  drag.dx = drag.dy = 0;
  await api("move_by", Math.round(dx), Math.round(dy));
  sending = false;
});
for (const end of ["pointerup", "pointercancel"]) $("box").addEventListener(end, () => { if (drag) { drag = null; api("back_to_game"); } });
api("info").then((i) => {
  $("name").textContent = i.name;
  paintSee(i.see);
  her = closeUp($("box"), { model: i.file || undefined, outfit: i.outfit, hair: i.hair, maxFps: 24 });
});
</script>
</body>
</html>
