# The Vermeil iPhone app. On a Mac:  brew install xcodegen  then, in this folder:  xcodegen  -> opens as Vermeil.xcodeproj
# (step-by-step: phone-ios/README.md)
name: Vermeil
options:
  bundleIdPrefix: com.vermeil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vermeil:
    type: application
    platform: iOS
    sources:
      - Vermeil
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vermeil.phone   # Xcode says it's taken? change it to com.<yourname>.vermeil
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Vermeil/Info.plist
      properties:
        CFBundleDisplayName: Vermeil
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Vermeil listens for her wake word and for what you ask her.
        NSSpeechRecognitionUsageDescription: Your words are turned into text on this iPhone so Vermeil hears her wake word.
        NSLocalNetworkUsageDescription: To reach Vermeil on your computer when you're on the same Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.vermeil.pair
            CFBundleURLSchemes: [vermeil]
